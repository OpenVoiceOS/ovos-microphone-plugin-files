[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-microphone-plugin-files"
description = "A files microphone implementation for OVOS"
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = ["ovos", "plugin", "listener", "microphone", "files"]
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.0",
    "Programming Language :: Python :: 3.1",
    "Programming Language :: Python :: 3.2",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
]
dynamic = ["version"]
dependencies = [
    "ovos-plugin-manager>=2.4.0a1",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-microphone-plugin-files"

[project.entry-points."opm.microphone"]
ovos-microphone-plugin-files = "ovos_microphone_plugin_files:FilesMicrophone"

[tool.setuptools.dynamic]
version = { attr = "ovos_microphone_plugin_files.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_microphone_plugin_files*"]
